# 참고 자료입니다. 이 위치의 파일은 Spring이 자동으로 읽지 않습니다.
# 기존 예제의 src/main/java/.../resources/application.yml도 기본 리소스 경로가 아닙니다.
# 나중에 Boot 자동 설정을 배울 때 src/main/resources/application.yml로 옮겨 비교하세요.
# 직접 @Bean으로 만든 JsonMapper와 YAML 자동 설정은 별개의 경로일 수 있습니다.
spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      indent-output: true
